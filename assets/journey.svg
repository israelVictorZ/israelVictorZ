<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Minha história em capítulos</title>
  <desc id="d">2021 a 2023: Front-end Júnior na Publinet Marketing Digital. 2022 a 2023: Front-end freelancer na OMIEXPERIENCE. 2023 a 2025: Front-end Pleno na Bloomin Group. Desde 2025: Front-end Pleno na Aprenda Certo. Em paralelo: Front-end autônomo para Ideal Marketing Médico e Agência Empreenda. Capítulo 06 em aberto: o próximo pode ser com você.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset=".7" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <style>
      .display{font-family:'Syne','Segoe UI Variable Display','Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800}
      .sans{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .chap{fill:#8e87a8;font-size:13px;letter-spacing:1.5px}
      .year{fill:#f3f0ff;font-size:34px}
      .co{fill:#f3f0ff;font-size:17px;font-weight:600}
      .role{fill:#a78bfa;font-size:15px}
      .date{fill:#8e87a8;font-size:13px;letter-spacing:.5px}
      .track{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2.4s .2s cubic-bezier(.6,0,.2,1) forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
      .node{opacity:0;animation:pop .5s ease forwards}
      .n1{animation-delay:.3s}.n2{animation-delay:.7s}.n3{animation-delay:1.1s}.n4{animation-delay:1.5s}.n5{animation-delay:1.9s}.n6{animation-delay:2.4s}
      @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      .ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
      @keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.track{stroke-dashoffset:0}.node{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="20" fill="#07050d"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="19.5" fill="none" stroke="#f3f0ff" stroke-opacity=".1"/>

  <!-- trilha -->
  <line x1="100" y1="130" x2="1100" y2="130" stroke="#f3f0ff" stroke-opacity=".08" stroke-width="2"/>
  <line class="track" x1="100" y1="130" x2="900" y2="130" stroke="url(#line)" stroke-width="2"/>
  <line x1="900" y1="130" x2="1100" y2="130" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 6" class="node n6"/>

  <g class="node n1">
    <text class="mono chap" x="100" y="46" text-anchor="middle">CAP. 01</text>
    <text class="display year" x="100" y="96" text-anchor="middle">2021</text>
    <circle cx="100" cy="130" r="7" fill="#07050d" stroke="#a78bfa" stroke-width="2"/>
    <text class="sans co" x="100" y="176" text-anchor="middle">Publinet</text>
    <text class="sans co" x="100" y="197" text-anchor="middle">Marketing Digital</text>
    <text class="sans role" x="100" y="224" text-anchor="middle">Front-end Júnior</text>
    <text class="mono date" x="100" y="248" text-anchor="middle">01/2021 — 04/2023</text>
  </g>
  <g class="node n2">
    <text class="mono chap" x="300" y="46" text-anchor="middle">CAP. 02</text>
    <text class="display year" x="300" y="96" text-anchor="middle">2022</text>
    <circle cx="300" cy="130" r="7" fill="#07050d" stroke="#a78bfa" stroke-width="2"/>
    <text class="sans co" x="300" y="176" text-anchor="middle">OMIEXPERIENCE</text>
    <text class="sans role" x="300" y="203" text-anchor="middle">Front-end Freelancer</text>
    <text class="mono date" x="300" y="227" text-anchor="middle">12/2022 — 02/2023</text>
  </g>
  <g class="node n3">
    <text class="mono chap" x="500" y="46" text-anchor="middle">CAP. 03</text>
    <text class="display year" x="500" y="96" text-anchor="middle">2023</text>
    <circle cx="500" cy="130" r="7" fill="#07050d" stroke="#a78bfa" stroke-width="2"/>
    <text class="sans co" x="500" y="176" text-anchor="middle">Bloomin Group</text>
    <text class="sans role" x="500" y="203" text-anchor="middle">Front-end Pleno</text>
    <text class="mono date" x="500" y="227" text-anchor="middle">04/2023 — 02/2025</text>
  </g>
  <g class="node n4">
    <text class="mono chap" x="700" y="46" text-anchor="middle">CAP. 04</text>
    <text class="display year" x="700" y="96" text-anchor="middle">2025</text>
    <circle class="ring" cx="700" cy="130" r="7" fill="#22c55e"/>
    <circle cx="700" cy="130" r="7" fill="#22c55e"/>
    <text class="sans co" x="700" y="176" text-anchor="middle">Aprenda Certo</text>
    <text class="sans role" x="700" y="203" text-anchor="middle">Front-end Pleno</text>
    <text class="mono date" x="700" y="227" text-anchor="middle" fill="#22c55e">04/2025 — ATUAL</text>
  </g>
  <g class="node n5">
    <text class="mono chap" x="900" y="46" text-anchor="middle">CAP. 05 · PARALELO</text>
    <text class="display year" x="900" y="96" text-anchor="middle">Hoje</text>
    <circle cx="900" cy="130" r="7" fill="#a78bfa"/>
    <text class="sans co" x="900" y="176" text-anchor="middle">Ideal Marketing Médico</text>
    <text class="sans co" x="900" y="197" text-anchor="middle">&amp; Agência Empreenda</text>
    <text class="sans role" x="900" y="224" text-anchor="middle">Front-end Autônomo</text>
    <text class="mono date" x="900" y="248" text-anchor="middle">PROJETOS PONTUAIS</text>
  </g>
  <g class="node n6">
    <text class="mono chap" x="1100" y="46" text-anchor="middle">CAP. 06 · EM ABERTO</text>
    <text class="display year" x="1100" y="96" text-anchor="middle" fill="none" stroke="#f3f0ff" stroke-width="1.2">?</text>
    <circle cx="1100" cy="130" r="7" fill="#07050d" stroke="#f3f0ff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 3"/>
    <text class="sans co" x="1100" y="176" text-anchor="middle">O próximo capítulo</text>
    <text class="sans co" x="1100" y="197" text-anchor="middle">pode ser com você.</text>
    <text class="sans role" x="1100" y="224" text-anchor="middle">Vamos conversar?</text>
  </g>

  <text class="mono" x="600" y="296" text-anchor="middle" font-size="13" letter-spacing="2" fill="#8e87a8">SÃO PAULO · PRIMEIRO COMMIT PROFISSIONAL AOS 16, AINDA NO ENSINO MÉDIO</text>
</svg>
