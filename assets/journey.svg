<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Minha história em capítulos</title>
  <desc id="d">2021 a 2023: Front-end Júnior na Publinet Marketing Digital. 2022 a 2023: Front-end freelancer na OMIEXPERIENCE. 2023 a 2025: Front-end Pleno na Bloomin Group. Desde 2025: Front-end Pleno na Aprenda Certo. Em paralelo: Front-end autônomo para Ideal Marketing Médico e Agência Empreenda.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset=".75" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <style>
      .display{font-family:'Syne','Segoe UI Variable Display','Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800}
      .sans{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .chap{fill:#8e87a8;font-size:13px;letter-spacing:2px}
      .year{fill:#f3f0ff;font-size:36px}
      .co{fill:#f3f0ff;font-size:18px;font-weight:600}
      .role{fill:#a78bfa;font-size:16px}
      .date{fill:#8e87a8;font-size:13px;letter-spacing:.5px}
      .track{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2.2s .2s cubic-bezier(.6,0,.2,1) forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
      .node{opacity:0;animation:pop .5s ease forwards}
      .n1{animation-delay:.3s}.n2{animation-delay:.75s}.n3{animation-delay:1.2s}.n4{animation-delay:1.65s}.n5{animation-delay:2.1s}
      @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      .ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
      @keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.track{stroke-dashoffset:0}.node{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="20" fill="#07050d"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="19.5" fill="none" stroke="#f3f0ff" stroke-opacity=".1"/>

  <!-- trilha -->
  <line x1="120" y1="130" x2="1080" y2="130" stroke="#f3f0ff" stroke-opacity=".08" stroke-width="2"/>
  <line class="track" x1="120" y1="130" x2="1080" y2="130" stroke="url(#line)" stroke-width="2"/>

  <g class="node n1">
    <text class="mono chap" x="120" y="46" text-anchor="middle">CAP. 01</text>
    <text class="display year" x="120" y="98" text-anchor="middle">2021</text>
    <circle cx="120" cy="130" r="7" fill="#07050d" stroke="#a78bfa" stroke-width="2"/>
    <text class="sans co" x="120" y="178" text-anchor="middle">Publinet</text>
    <text class="sans co" x="120" y="200" text-anchor="middle">Marketing Digital</text>
    <text class="sans role" x="120" y="228" text-anchor="middle">Front-end Júnior</text>
    <text class="mono date" x="120" y="253" text-anchor="middle">01/2021 — 04/2023</text>
  </g>
  <g class="node n2">
    <text class="mono chap" x="360" y="46" text-anchor="middle">CAP. 02</text>
    <text class="display year" x="360" y="98" text-anchor="middle">2022</text>
    <circle cx="360" cy="130" r="7" fill="#07050d" stroke="#a78bfa" stroke-width="2"/>
    <text class="sans co" x="360" y="178" text-anchor="middle">OMIEXPERIENCE</text>
    <text class="sans role" x="360" y="206" text-anchor="middle">Front-end Freelancer</text>
    <text class="mono date" x="360" y="231" text-anchor="middle">12/2022 — 02/2023</text>
  </g>
  <g class="node n3">
    <text class="mono chap" x="600" y="46" text-anchor="middle">CAP. 03</text>
    <text class="display year" x="600" y="98" text-anchor="middle">2023</text>
    <circle cx="600" cy="130" r="7" fill="#07050d" stroke="#a78bfa" stroke-width="2"/>
    <text class="sans co" x="600" y="178" text-anchor="middle">Bloomin Group</text>
    <text class="sans role" x="600" y="206" text-anchor="middle">Front-end Pleno</text>
    <text class="mono date" x="600" y="231" text-anchor="middle">04/2023 — 02/2025</text>
  </g>
  <g class="node n4">
    <text class="mono chap" x="840" y="46" text-anchor="middle">CAP. 04</text>
    <text class="display year" x="840" y="98" text-anchor="middle">2025</text>
    <circle class="ring" cx="840" cy="130" r="7" fill="#a78bfa"/>
    <circle cx="840" cy="130" r="7" fill="#a78bfa"/>
    <text class="sans co" x="840" y="178" text-anchor="middle">Aprenda Certo</text>
    <text class="sans role" x="840" y="206" text-anchor="middle">Front-end Pleno</text>
    <text class="mono date" x="840" y="231" text-anchor="middle" fill="#c4b5fd">04/2025 — ATUAL</text>
  </g>
  <g class="node n5">
    <text class="mono chap" x="1080" y="46" text-anchor="middle">CAP. 05 · PARALELO</text>
    <text class="display year" x="1080" y="98" text-anchor="middle">Hoje</text>
    <circle cx="1080" cy="130" r="7" fill="#c4b5fd"/>
    <text class="sans co" x="1080" y="178" text-anchor="middle">Ideal Marketing Médico</text>
    <text class="sans co" x="1080" y="200" text-anchor="middle">&amp; Agência Empreenda</text>
    <text class="sans role" x="1080" y="228" text-anchor="middle">Front-end Autônomo</text>
    <text class="mono date" x="1080" y="253" text-anchor="middle">PROJETOS PONTUAIS</text>
  </g>

  <text class="mono" x="600" y="298" text-anchor="middle" font-size="13" letter-spacing="2" fill="#8e87a8">SÃO PAULO · PRIMEIRO COMMIT PROFISSIONAL AOS 16, AINDA NO ENSINO MÉDIO</text>
</svg>
